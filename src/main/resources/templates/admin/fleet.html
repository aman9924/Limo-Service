<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Fleet | HONK Limousine Service</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
  <div class="container">
    <span class="navbar-brand brand-font fs-4 fw-bold">HONK <span>ADMIN</span></span>
    <div class="d-flex align-items-center gap-3">
      <a th:href="@{/admin/bookings}" class="nav-link d-inline">Bookings</a>
      <a th:href="@{/admin/fleet}" class="nav-link d-inline text-gold">Fleet</a>
      <a th:href="@{/admin/pricing}" class="nav-link d-inline">Pricing</a>
      <span style="color:var(--gray);">Logged in as <strong sec:authentication="name" class="text-gold"></strong></span>
      <form th:action="@{/admin/logout}" method="post" class="mb-0">
        <button type="submit" class="btn btn-outline-gold btn-sm">Log Out</button>
      </form>
    </div>
  </div>
</nav>

<section class="section-padding" style="padding-top:120px;">
  <div class="container">
    <h1 class="section-title mb-4">Fleet</h1>

    <div class="table-responsive mb-5">
      <table class="table table-dark table-bordered align-middle">
        <thead>
          <tr>
            <th>Key</th>
            <th>Name</th>
            <th>Capacity</th>
            <th>Luggage</th>
            <th>$/hr</th>
            <th>Icon Class</th>
            <th>Description</th>
            <th>Order</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="v : ${vehicles}">
            <td>
              <input type="text" name="vehicleKey" th:value="${v.vehicleKey}" th:form="'vf' + ${v.id}" class="form-control form-control-dark form-control-sm" />
            </td>
            <td>
              <input type="text" name="name" th:value="${v.name}" th:form="'vf' + ${v.id}" class="form-control form-control-dark form-control-sm" />
            </td>
            <td>
              <input type="number" name="capacity" th:value="${v.capacity}" th:form="'vf' + ${v.id}" class="form-control form-control-dark form-control-sm" style="width:80px;" />
            </td>
            <td>
              <input type="number" name="luggage" th:value="${v.luggage}" th:form="'vf' + ${v.id}" class="form-control form-control-dark form-control-sm" style="width:80px;" />
            </td>
            <td>
              <input type="number" step="0.01" name="pricePerHour" th:value="${v.pricePerHour}" th:form="'vf' + ${v.id}" class="form-control form-control-dark form-control-sm" style="width:90px;" />
            </td>
            <td>
              <input type="text" name="iconClass" th:value="${v.iconClass}" th:form="'vf' + ${v.id}" class="form-control form-control-dark form-control-sm" style="width:120px;" />
            </td>
            <td>
              <input type="text" name="description" th:value="${v.description}" th:form="'vf' + ${v.id}" class="form-control form-control-dark form-control-sm" style="min-width:220px;" />
            </td>
            <td>
              <input type="number" name="displayOrder" th:value="${v.displayOrder}" th:form="'vf' + ${v.id}" class="form-control form-control-dark form-control-sm" style="width:70px;" />
            </td>
            <td class="d-flex gap-1">
              <!-- Empty form declared here; inputs above reference it by id via the form="" attribute since a <form> can't wrap multiple <td>s. -->
              <form th:id="'vf' + ${v.id}" th:action="@{/admin/fleet/{id}(id=${v.id})}" method="post"></form>
              <button type="submit" th:form="'vf' + ${v.id}" class="btn btn-outline-gold btn-sm">Save</button>
              <form th:action="@{/admin/fleet/{id}/delete(id=${v.id})}" method="post" onsubmit="return confirm('Delete this vehicle?');">
                <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <h2 class="section-title mb-4">Add New Vehicle</h2>
    <form th:action="@{/admin/fleet}" method="post" class="row g-3 booking-form-card">
      <div class="col-md-3">
        <label class="form-label-dark">Key (matches booking form value)</label>
        <input type="text" name="vehicleKey" class="form-control form-control-dark" required placeholder="e.g. sedan" />
      </div>
      <div class="col-md-3">
        <label class="form-label-dark">Name</label>
        <input type="text" name="name" class="form-control form-control-dark" required />
      </div>
      <div class="col-md-2">
        <label class="form-label-dark">Capacity</label>
        <input type="number" name="capacity" class="form-control form-control-dark" required />
      </div>
      <div class="col-md-2">
        <label class="form-label-dark">Luggage</label>
        <input type="number" name="luggage" class="form-control form-control-dark" required />
      </div>
      <div class="col-md-2">
        <label class="form-label-dark">$/hr</label>
        <input type="number" step="0.01" name="pricePerHour" class="form-control form-control-dark" required />
      </div>
      <div class="col-md-4">
        <label class="form-label-dark">Icon Class (Bootstrap Icons)</label>
        <input type="text" name="iconClass" class="form-control form-control-dark" placeholder="e.g. bi-car-front-fill" required />
      </div>
      <div class="col-md-6">
        <label class="form-label-dark">Description</label>
        <input type="text" name="description" class="form-control form-control-dark" required />
      </div>
      <div class="col-md-2">
        <label class="form-label-dark">Display Order</label>
        <input type="number" name="displayOrder" class="form-control form-control-dark" value="0" />
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-gold">Add Vehicle</button>
      </div>
    </form>
  </div>
</section>

</body>
</html>
