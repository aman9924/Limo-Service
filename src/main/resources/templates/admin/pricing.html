<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Pricing - HONK Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --gold: #D4AF37;
            --dark: #121212;
            --gray: #999999;
            --panel: #1e1e1e;
        }
        body { background-color: var(--dark); color: #fff; }
        .sidebar { background-color: #000; min-height: 100vh; border-right: 1px solid #333; padding: 20px; }
        .sidebar a { color: var(--gray); text-decoration: none; display: block; padding: 10px; border-radius: 5px; margin-bottom: 5px; }
        .sidebar a:hover, .sidebar a.active { background-color: #222; color: var(--gold); }
        .card { background-color: var(--panel); border: 1px solid #333; }
        .form-control, .form-select { background-color: #2a2a2a; border: 1px solid #444; color: #fff; }
        .form-control:focus, .form-select:focus { background-color: #333; border-color: var(--gold); color: #fff; box-shadow: none; }
        .btn-gold { background-color: var(--gold); color: #000; font-weight: 600; }
        .btn-gold:hover { background-color: #bfa030; color: #000; }
        .text-gold { color: var(--gold); }
        th { color: var(--gray); }
        td { vertical-align: middle; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <h4 class="text-gold mb-4"><i class="bi bi-car-front-fill"></i> HONK Admin</h4>
            <a href="/admin/bookings"><i class="bi bi-list-check me-2"></i> Bookings</a>
            <a href="/admin/fleet"><i class="bi bi-car-front me-2"></i> Fleet</a>
            <a href="/admin/pricing" class="active"><i class="bi bi-currency-dollar me-2"></i> Pricing</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Manage Pricing Rates</h2>
                <a href="/" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-up-right"></i> View Site</a>
            </div>

            <!-- Global Addons -->
            <div class="card mb-4">
                <div class="card-header bg-black text-gold">
                    <i class="bi bi-plus-circle me-2"></i> Global Add-ons
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/pricing/addons}" method="post" class="d-flex align-items-end gap-3">
                        <div>
                            <label class="form-label text-secondary small">Meet & Greet Fee ($)</label>
                            <input type="number" step="0.01" class="form-control form-control-sm" name="meetAndGreetFee" th:value="${addonPricing.meetAndGreetFee}">
                        </div>
                        <button type="submit" class="btn btn-gold btn-sm">Update Add-ons</button>
                    </form>
                </div>
            </div>

            <!-- Vehicle Rates -->
            <div class="card">
                <div class="card-header bg-black text-gold">
                    <i class="bi bi-speedometer2 me-2"></i> Vehicle Rates
                </div>
                <div class="card-body p-0 table-responsive">
                    <table class="table table-dark table-hover mb-0">
                        <thead class="bg-black">
                        <tr>
                            <th>Vehicle Key</th>
                            <th>Label</th>
                            <th>Tier 1 (1-10 mi) ($)</th>
                            <th>Tier 2 (11-20 mi) ($)</th>
                            <th>Tier 3 (21-30 mi) ($)</th>
                            <th>Per Mile Rate (>30 mi) ($)</th>
                            <th>Call For Pricing?</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${rates}">
                            <form th:action="@{/admin/pricing/{id}(id=${r.id})}" method="post">
                                <td><span th:text="${r.vehicleKey}" class="badge bg-secondary"></span></td>
                                <td><input type="text" class="form-control form-control-sm" name="label" th:value="${r.label}" required></td>
                                <td><input type="number" step="0.01" class="form-control form-control-sm" name="tier1Price" th:value="${r.tier1Price}"></td>
                                <td><input type="number" step="0.01" class="form-control form-control-sm" name="tier2Price" th:value="${r.tier2Price}"></td>
                                <td><input type="number" step="0.01" class="form-control form-control-sm" name="tier3Price" th:value="${r.tier3Price}"></td>
                                <td><input type="number" step="0.01" class="form-control form-control-sm" name="perMileRate" th:value="${r.perMileRate}"></td>
                                <td>
                                    <input type="checkbox" name="callForPricingOnly" value="true" th:checked="${r.callForPricingOnly}">
                                </td>
                                <td>
                                    <button type="submit" class="btn btn-gold btn-sm"><i class="bi bi-save"></i> Save</button>
                                </td>
                            </form>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
