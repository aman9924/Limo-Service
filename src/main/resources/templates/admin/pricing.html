<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Pricing | HONK Limousine Service</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
  <div class="container">
    <span class="navbar-brand brand-font fs-4 fw-bold">HONK <span>ADMIN</span></span>
    <div class="d-flex align-items-center gap-3">
      <a th:href="@{/admin/bookings}" class="nav-link d-inline">Bookings</a>
      <a th:href="@{/admin/fleet}" class="nav-link d-inline">Fleet</a>
      <a th:href="@{/admin/pricing}" class="nav-link d-inline text-gold">Pricing</a>
      <span style="color:var(--gray);">Logged in as <strong sec:authentication="name" class="text-gold"></strong></span>
      <form th:action="@{/admin/logout}" method="post" class="mb-0">
        <button type="submit" class="btn btn-outline-gold btn-sm">Log Out</button>
      </form>
    </div>
  </div>
</nav>

<section class="section-padding" style="padding-top:120px;">
  <div class="container">
    <h1 class="section-title mb-4">Pricing Rates</h1>
    <p style="color:var(--gray);" class="mb-4">
      These rates drive both the public Pricing page and the live fare estimate on the booking form.
      Vehicle types not listed here always show as "Call for Pricing".
    </p>

    <div class="table-responsive">
      <table class="table table-dark table-bordered align-middle">
        <thead>
          <tr>
            <th>Vehicle Key</th>
            <th>Label</th>
            <th>Airport Flat Rate ($)</th>
            <th>Per-Mile Rate ($)</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="r : ${rates}">
            <td th:text="${r.vehicleKey}"></td>
            <td>
              <input type="text" name="label" th:value="${r.label}" th:form="'pf' + ${r.id}" class="form-control form-control-dark form-control-sm" />
            </td>
            <td>
              <input type="number" step="0.01" name="flatAirportRate" th:value="${r.flatAirportRate}" th:form="'pf' + ${r.id}" class="form-control form-control-dark form-control-sm" />
            </td>
            <td>
              <input type="number" step="0.01" name="perMileRate" th:value="${r.perMileRate}" th:form="'pf' + ${r.id}" class="form-control form-control-dark form-control-sm" />
            </td>
            <td>
              <!-- Empty form declared here; inputs above reference it by id since a <form> can't wrap multiple <td>s. -->
              <form th:id="'pf' + ${r.id}" th:action="@{/admin/pricing/{id}(id=${r.id})}" method="post"></form>
              <button type="submit" th:form="'pf' + ${r.id}" class="btn btn-outline-gold btn-sm">Save</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

</body>
</html>
