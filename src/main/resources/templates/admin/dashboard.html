<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/jpeg" th:href="@{/images/fleet/logo/new%20honk%20logo.jpg}" href="/images/fleet/logo/new%20honk%20logo.jpg" />
<title>Admin Dashboard | HONK Limousine Service</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
  <div class="container">
    <span class="navbar-brand brand-font fs-4 fw-bold d-flex align-items-center gap-2">
      <img src="/images/fleet/logo/honk-logo.png" alt="HONK Logo" height="40" />
      HONK <span>ADMIN</span>
    </span>
    <div class="d-flex align-items-center gap-3">
      <a th:href="@{/admin/bookings}" class="nav-link d-inline text-gold">Bookings</a>
      <a th:href="@{/admin/fleet}" class="nav-link d-inline">Fleet</a>
      <a th:href="@{/admin/pricing}" class="nav-link d-inline">Pricing</a>
      <span style="color:var(--gray);">Logged in as <strong sec:authentication="name" class="text-gold"></strong></span>
      <form th:action="@{/admin/logout}" method="post" class="mb-0">
        <button type="submit" class="btn btn-outline-gold btn-sm">Log Out</button>
      </form>
    </div>
  </div>
</nav>

<section class="section-padding" style="padding-top:120px;">
  <div class="container">
    <h1 class="section-title mb-5">Dashboard Overview</h1>

    <!-- KPI Metric Cards -->
    <div class="row mb-5 g-4">
      <div class="col-md-4">
        <div class="admin-stat-card">
          <h3>Total Bookings</h3>
          <div class="stat-value" th:text="${bookings.size()}">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="admin-stat-card" style="border-color: var(--gold);">
          <h3 style="color: var(--white);">Pending Action</h3>
          <div class="stat-value" th:text="${bookings.?[status.name() == 'PENDING'].size()}">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="admin-stat-card">
          <h3>Confirmed</h3>
          <div class="stat-value" th:text="${bookings.?[status.name() == 'CONFIRMED'].size()}">0</div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fs-4 fw-bold" style="color: var(--white);">Recent Bookings</h2>
      <a th:href="@{/admin/bookings/export(q=${q})}" class="btn btn-outline-gold btn-sm">
        <i class="bi bi-download"></i> Export CSV
      </a>
    </div>

    <div class="row mb-4">
      <div class="col-md-12">
        <form th:action="@{/admin/bookings}" method="get" class="d-flex gap-2">
          <input type="text" name="q" th:value="${q}" class="form-control form-control-dark" placeholder="Search by reference, customer name, or phone" style="max-width: 400px;" />
          <button type="submit" class="btn btn-gold">Search</button>
        </form>
      </div>
    </div>

    <div class="admin-table-wrapper">
      <table class="admin-table align-middle">
        <thead>
          <tr>
            <th>Reference</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Pickup</th>
            <th>Drop-off</th>
            <th>Date / Time</th>
            <th>Vehicle</th>
            <th>Fare</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="b : ${bookings}">
            <td th:text="${b.bookingReference}"></td>
            <td th:text="${b.customer.name}"></td>
            <td th:text="${b.customer.phone}"></td>
            <td th:text="${b.pickupLocation}"></td>
            <td>
              <span th:text="${b.dropoffLocation}"></span>
              <span th:if="${b.meetAndGreet}" class="badge ms-1" style="background-color: rgba(201,162,75,0.15); color: var(--gold); border: 1px solid rgba(201,162,75,0.4); font-size:0.68rem;" title="Meet & Greet requested">M&amp;G</span>
            </td>
            <td th:text="${b.pickupDate + ' ' + b.pickupTime}"></td>
            <td th:text="${b.vehicleType}"></td>
            <td th:text="${b.estimatedFare}"></td>
            <td>
              <span class="badge" style="padding: 8px 12px; font-weight: 500;"
                    th:classappend="${b.status.name() == 'PENDING'} ? 'admin-badge-pending' : (${b.status.name() == 'CONFIRMED'} ? 'admin-badge-confirmed' : (${b.status.name() == 'CANCELLED'} ? 'admin-badge-cancelled' : 'admin-badge-completed'))"
                    th:text="${b.status}"></span>
            </td>
            <td style="min-width:260px;">
              <form th:action="@{/admin/bookings/{id}/update(id=${b.id})}" method="post" class="admin-action-box mb-2">
                <input type="hidden" name="q" th:value="${q}" />
                <div class="d-flex gap-2 mb-2">
                  <select name="status" class="form-select form-select-dark form-select-sm" style="flex: 1;">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == b.status}"></option>
                  </select>
                </div>
                <div class="d-flex gap-2 mb-2">
                  <input type="text" name="driverName" class="form-control form-control-dark form-control-sm" placeholder="Driver Name" th:value="${b.driverName}" />
                  <input type="text" name="driverPhone" class="form-control form-control-dark form-control-sm" placeholder="Driver Phone" th:value="${b.driverPhone}" />
                </div>
                <button type="submit" class="btn btn-gold btn-sm w-100">Update</button>
              </form>
              <form th:action="@{/admin/bookings/{id}/delete(id=${b.id})}" method="post"
                    onsubmit="return confirm('Delete this booking permanently?');">
                <input type="hidden" name="q" th:value="${q}" />
                <button type="submit" class="btn btn-outline-danger btn-sm w-100">Delete</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(bookings)}">
            <td colspan="9" class="text-center" style="color:var(--gray);">No bookings found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

</body>
</html>
