<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard | HONK Limousine Service</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
  <div class="container">
    <span class="navbar-brand brand-font fs-4 fw-bold">HONK <span>ADMIN</span></span>
    <div class="d-flex align-items-center gap-3">
      <a th:href="@{/admin/bookings}" class="nav-link d-inline text-gold">Bookings</a>
      <a th:href="@{/admin/fleet}" class="nav-link d-inline">Fleet</a>
      <a th:href="@{/admin/pricing}" class="nav-link d-inline">Pricing</a>
      <span style="color:var(--gray);">Logged in as <strong sec:authentication="name" class="text-gold"></strong></span>
      <form th:action="@{/admin/logout}" method="post" class="mb-0">
        <button type="submit" class="btn btn-outline-gold btn-sm">Log Out</button>
      </form>
    </div>
  </div>
</nav>

<section class="section-padding" style="padding-top:120px;">
  <div class="container">
    <h1 class="section-title mb-4">Bookings</h1>

    <div class="row mb-4 g-2 align-items-center">
      <div class="col-md-6">
        <form th:action="@{/admin/bookings}" method="get" class="d-flex gap-2">
          <input type="text" name="q" th:value="${q}" class="form-control form-control-dark" placeholder="Search by reference, name, or phone" />
          <button type="submit" class="btn btn-gold">Search</button>
        </form>
      </div>
      <div class="col-md-6 text-md-end">
        <a th:href="@{/admin/bookings/export(q=${q})}" class="btn btn-outline-gold">
          <i class="bi bi-download"></i> Export CSV
        </a>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-dark table-bordered align-middle">
        <thead>
          <tr>
            <th>Reference</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Pickup</th>
            <th>Drop-off</th>
            <th>Date / Time</th>
            <th>Vehicle</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="b : ${bookings}">
            <td th:text="${b.bookingReference}"></td>
            <td th:text="${b.customer.name}"></td>
            <td th:text="${b.customer.phone}"></td>
            <td th:text="${b.pickupLocation}"></td>
            <td th:text="${b.dropoffLocation}"></td>
            <td th:text="${b.pickupDate + ' ' + b.pickupTime}"></td>
            <td th:text="${b.vehicleType}"></td>
            <td>
              <span class="badge"
                    th:classappend="${b.status.name() == 'PENDING'} ? 'bg-warning text-dark' : (${b.status.name() == 'CONFIRMED'} ? 'bg-success' : (${b.status.name() == 'CANCELLED'} ? 'bg-danger' : 'bg-secondary'))"
                    th:text="${b.status}"></span>
            </td>
            <td style="min-width:260px;">
              <form th:action="@{/admin/bookings/{id}/update(id=${b.id})}" method="post" class="d-flex flex-column gap-2 mb-2 p-2 rounded" style="background: rgba(255,255,255,0.05);">
                <input type="hidden" name="q" th:value="${q}" />
                <select name="status" class="form-select form-select-dark form-select-sm">
                  <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == b.status}"></option>
                </select>
                <input type="text" name="driverName" class="form-control form-control-dark form-control-sm" placeholder="Driver Name" th:value="${b.driverName}" />
                <input type="text" name="driverPhone" class="form-control form-control-dark form-control-sm" placeholder="Driver Phone" th:value="${b.driverPhone}" />
                <button type="submit" class="btn btn-outline-gold btn-sm w-100">Update Booking</button>
              </form>
              <form th:action="@{/admin/bookings/{id}/delete(id=${b.id})}" method="post"
                    onsubmit="return confirm('Delete this booking permanently?');">
                <input type="hidden" name="q" th:value="${q}" />
                <button type="submit" class="btn btn-outline-danger btn-sm w-100">Delete</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(bookings)}">
            <td colspan="9" class="text-center" style="color:var(--gray);">No bookings found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

</body>
</html>
