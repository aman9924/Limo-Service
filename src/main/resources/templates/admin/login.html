<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login | HONK Limousine Service</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css" />
</head>
<body>

<section class="hero" style="min-height:100vh;">
  <div class="container" style="max-width:420px;">
    <div class="quick-booking-card">
      <h2 class="brand-font text-center mb-4">HONK <span class="text-gold">ADMIN</span></h2>

      <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
      <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>

      <form th:action="@{/admin/login}" method="post">
        <div class="mb-3">
          <label class="form-label-dark">Username</label>
          <input type="text" name="username" class="form-control form-control-dark" required autofocus />
        </div>
        <div class="mb-3">
          <label class="form-label-dark">Password</label>
          <input type="password" name="password" class="form-control form-control-dark" required />
        </div>
        <button type="submit" class="btn btn-gold w-100">Log In</button>
      </form>
    </div>
  </div>
</section>

</body>
</html>
